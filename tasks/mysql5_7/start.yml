---
- name: Copy Mysql 5.7 folder
  copy: 
    src: ./docker/mysql5_7
    dest: ~/docker
    mode: 0755
    
- name: Shut down service
  shell: |
    cd ~/docker/mysql5_7
    docker compose down

- name: Start Mysql 5.7
  shell: |
    cd ~/docker/mysql5_7
    export TZ={{tz}}
    export MYSQL_ROOT_USER={{mysql5_7_root_user}}
    export MYSQL_ROOT_PASSWORD={{mysql5_7_root_password}}
    export MYSQL_DATABASE={{mysql5_7_db}}
    export MYSQL_USER={{mysql5_7_user}}
    export MYSQL_PASSWORD={{mysql5_7_password}}
    export PORT={{mysql5_7_port_export}}
    export NETWORK={{network}}
    export LOG_MAX_SIZE={{log_max_size}}
    export LOG_MAX_FILE={{log_max_file}}
    docker compose up -d