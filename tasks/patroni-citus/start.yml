---
- name: Shut down service
  shell: |
    cd /docker/patroni-citus
    docker compose down

- name: Start patroni-citus
  shell: |
    cd /docker/patroni-citus
    export PATRONI_RESTAPI_USERNAME={{patroni_citus_restapi_username}}
    export PATRONI_RESTAPI_PASSWORD={{patroni_citus_restapi_password}}
    export PATRONI_SUPERUSER_USERNAME={{patroni_citus_root_username}}
    export PATRONI_SUPERUSER_PASSWORD={{patroni_citus_root_password}}
    export PATRONI_REPLICATION_USERNAME={{patroni_citus_replication_username}}
    export PATRONI_REPLICATION_PASSWORD={{patroni_citus_replication_password}}
    export PATRONI_admin_PASSWORD={{patroni_citus_admin_password}}
    export PORT={{patroni_citus_port_export}}
    export PATRONI_SCOPE={{patroni_citus_scope}}
    export NETWORK={{network}}
    export LOG_MAX_SIZE={{log_max_size}}
    export LOG_MAX_FILE={{log_max_file}}
    docker compose up -d
