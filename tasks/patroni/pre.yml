---
- name: Ensure deployment directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ patroni_compose_dir }}", mode: "0755" }
    - { path: "{{ patroni_compose_dir }}/config/patroni/nodes", mode: "0755" }
    - { path: "{{ patroni_compose_dir }}/runtime", mode: "0755" }
    - { path: "{{ patroni_data_dir }}", mode: "0755" }
    - { path: "{{ patroni_etcd_data_dir }}", mode: "0755" }

- name: Ensure PostgreSQL data directories are writable by the container postgres user
  ansible.builtin.file:
    path: "{{ patroni_data_dir }}/{{ item }}"
    state: directory
    owner: "{{ patroni_container_uid }}"
    group: "{{ patroni_container_gid }}"
    mode: "0700"
  loop:
    - coord1
    - coord2
    - coord3
    - work1-1
    - work1-2
    - work2-1
    - work2-2

- name: Ensure etcd data directories are writable by the container postgres user
  ansible.builtin.file:
    path: "{{ patroni_etcd_data_dir }}/{{ item }}"
    state: directory
    owner: "{{ patroni_container_uid }}"
    group: "{{ patroni_container_gid }}"
    mode: "0700"
  loop:
    - etcd1
    - etcd2
    - etcd3

- name: Copy Patroni base config
  ansible.builtin.copy:
    src: ./docker/patroni/config/patroni/00-base.yml
    dest: "{{ patroni_compose_dir }}/config/patroni/00-base.yml"
    owner: root
    group: root
    mode: "0644"

- name: Copy Patroni node configs
  ansible.builtin.copy:
    src: "./docker/patroni/config/patroni/nodes/{{ item }}.yml"
    dest: "{{ patroni_compose_dir }}/config/patroni/nodes/{{ item }}.yml"
    owner: root
    group: root
    mode: "0644"
  loop:
    - coord1
    - coord2
    - coord3
    - work1-1
    - work1-2
    - work2-1
    - work2-2

- name: Generate Patroni SSL files
  ansible.builtin.import_tasks: generate-ssl.yml

- name: Render HAProxy confd template
  ansible.builtin.import_tasks: generate-haproxy-config.yml

- name: Render PgBouncer config
  ansible.builtin.import_tasks: generate-pgbouncer-config.yml

- name: Render pgBackRest config
  ansible.builtin.import_tasks: generate-pgbackrest-config.yml

- name: Copy docker compose file
  ansible.builtin.copy:
    src: ./docker/patroni/docker-compose.yml
    dest: "{{ patroni_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Render managed Compose dotenv
  ansible.builtin.template:
    src: templates/patroni/env.j2
    dest: "{{ patroni_compose_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true