---
- name: Run Patroni Compose lifecycle commands
  # Pass Vault values as environment variables, not interpolated shell code.
  environment:
    PATRONI_RESTAPI_USERNAME: "{{ patroni_restapi_username | default('admin') }}"
    PATRONI_RESTAPI_PASSWORD: "{{ patroni_restapi_password }}"
    PATRONI_SUPERUSER_USERNAME: "{{ patroni_superuser_username | default('postgres') }}"
    PATRONI_SUPERUSER_PASSWORD: "{{ patroni_superuser_password }}"
    PATRONI_REPLICATION_USERNAME: "{{ patroni_replication_username | default('replicator') }}"
    PATRONI_REPLICATION_PASSWORD: "{{ patroni_replication_password }}"
    PATRONI_REWIND_USERNAME: "{{ patroni_rewind_username | default('rewind_user') }}"
    PATRONI_REWIND_PASSWORD: "{{ patroni_rewind_password }}"
    PATRONI_SCOPE: "{{ patroni_scope | default('demo') }}"
    PATRONI_NAMESPACE: "{{ patroni_namespace | default('/service') }}"
    PATRONI_ETCD_INITIAL_CLUSTER_TOKEN: "{{ patroni_etcd_initial_cluster_token | default('citus-cluster') }}"
    PATRONI_DATA_DIR: "{{ patroni_data_dir }}"
    PATRONI_ETCD_DATA_DIR: "{{ patroni_etcd_data_dir }}"
    PATRONI_SSL_DIR: "{{ patroni_ssl_dir_effective }}"
    PATRONI_HAPROXY_TEMPLATE_DIR: "{{ patroni_haproxy_template_dir_effective }}"
    PATRONI_DOCKER_NETWORK: "{{ patroni_docker_network | default('patroni_citus') }}"
    PATRONI_PGBACKREST_CONFIG_DIR: "{{ patroni_pgbackrest_config_dir_effective }}"
    PATRONI_PGBACKREST_LOG_DIR: "{{ patroni_pgbackrest_log_dir_effective }}"
    PATRONI_PGBOUNCER_CONFIG_DIR: "{{ patroni_pgbouncer_config_dir_effective }}"
    PATRONI_IMAGE: "{{ patroni_image | default('anvu69/patroni-citus:4.1.3-pgbr') }}"
    PATRONI_PGBOUNCER_IMAGE: "{{ patroni_pgbouncer_image | default('edoburu/pgbouncer:v1.25.2-p0') }}"
    PATRONI_PGBOUNCER_DB_USER: "{{ patroni_pgbouncer_db_user | default(patroni_superuser_username | default('postgres')) }}"
    PATRONI_HAPROXY_BIND: "{{ patroni_haproxy_bind | default('127.0.0.1') }}"
    PATRONI_HAPROXY_COORDINATOR_PORT: "{{ patroni_haproxy_coordinator_port | default(15437) }}"
    PATRONI_HAPROXY_WORKERS_PORT: "{{ patroni_haproxy_workers_port | default(16491) }}"
    PATRONI_HAPROXY_STATS_PORT: "{{ patroni_haproxy_stats_port | default(19083) }}"
    PATRONI_PGBOUNCER_BIND: "{{ patroni_pgbouncer_bind | default('127.0.0.1') }}"
    PATRONI_PGBOUNCER_PORT: "{{ patroni_pgbouncer_port | default(26432) }}"
  no_log: true
  block:
    - name: Pull required container images
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yml pull
        chdir: "{{ patroni_compose_dir }}"
      when: patroni_compose_pull | default(true) | bool

    - name: Stop existing Patroni Citus stack before restart
      ansible.builtin.command:
        cmd: "docker compose -f docker-compose.yml stop --timeout {{ patroni_compose_stop_timeout | default(60) }}"
        chdir: "{{ patroni_compose_dir }}"
      when: patroni_compose_stop_before_start | default(true) | bool

    - name: Remove existing Patroni Citus containers before restart
      ansible.builtin.command:
        cmd: "docker compose -f docker-compose.yml down --timeout {{ patroni_compose_stop_timeout | default(60) }} --remove-orphans"
        chdir: "{{ patroni_compose_dir }}"
      when: patroni_compose_down_before_start | default(false) | bool

    - name: Start Patroni Citus stack
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yml up -d
        chdir: "{{ patroni_compose_dir }}"

    - name: Show compose services
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yml ps
        chdir: "{{ patroni_compose_dir }}"
      register: patroni_compose_ps
      changed_when: false

- name: Print compose services
  ansible.builtin.debug:
    var: patroni_compose_ps.stdout_lines
