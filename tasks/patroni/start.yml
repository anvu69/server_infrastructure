---
- name: Run Patroni Compose lifecycle commands
  vars:
    # Keep running containers untouched unless recreation is explicitly requested.
    patroni_compose_up_args: "{{ '-d' if (patroni_compose_recreate | default(false) | bool) else '-d --no-recreate' }}"
  no_log: true
  block:
    - name: Pull required container images
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yml pull
        chdir: "{{ patroni_compose_dir }}"
      when: patroni_compose_pull | default(false) | bool

    - name: Stop existing Patroni Citus stack before restart
      ansible.builtin.command:
        cmd: "docker compose -f docker-compose.yml stop --timeout {{ patroni_compose_stop_timeout | default(60) }}"
        chdir: "{{ patroni_compose_dir }}"
      when: patroni_compose_stop_before_start | default(false) | bool

    - name: Remove existing Patroni Citus containers before restart
      ansible.builtin.command:
        cmd: "docker compose -f docker-compose.yml down --timeout {{ patroni_compose_stop_timeout | default(60) }} --remove-orphans"
        chdir: "{{ patroni_compose_dir }}"
      when: patroni_compose_down_before_start | default(false) | bool

    - name: Preview Patroni Compose changes
      ansible.builtin.command:
        cmd: "docker compose --dry-run -f docker-compose.yml up {{ patroni_compose_up_args }}"
        chdir: "{{ patroni_compose_dir }}"
      register: patroni_compose_plan
      changed_when: false

    - name: Print Patroni Compose dry-run output
      ansible.builtin.debug:
        msg: "{{ patroni_compose_plan.stdout_lines + patroni_compose_plan.stderr_lines }}"
      when: patroni_compose_plan is not skipped
      no_log: false

    - name: Start Patroni Citus stack
      ansible.builtin.command:
        cmd: "docker compose -f docker-compose.yml up {{ patroni_compose_up_args }}"
        chdir: "{{ patroni_compose_dir }}"

    - name: Show compose services
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yml ps
        chdir: "{{ patroni_compose_dir }}"
      register: patroni_compose_ps
      changed_when: false

- name: Print compose services
  ansible.builtin.debug:
    var: patroni_compose_ps.stdout_lines
  when: patroni_compose_ps is not skipped
