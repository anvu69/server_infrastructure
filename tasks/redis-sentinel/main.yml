- name: Sao chép file docker-compose.yml
  template:
    src: templates/redis-sentinel/docker-compose.yml.j2
    dest: "/docker/redis-sentinel/docker-compose.yml"
    mode: "0644"

- name: Stop redis-sentinel
  shell: |
    cd /docker/redis-sentinel
    export NETWORK={{network}}
    export MASTER_PORT={{master_port}}
    export SENTINEL_PORT={{sentinel_port}}
    docker compose down

- name: Start redis-sentinel
  shell: |
    cd /docker/redis-sentinel
    export REDIS_PASSWORD={{redis_password}}
    export MASTER_PORT={{master_port}}
    export SENTINEL_PORT={{sentinel_port}}
    export NETWORK={{network}}
    docker compose up -d
