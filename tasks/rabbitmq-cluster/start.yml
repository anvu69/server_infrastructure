---
- name: Copy rabbitmq-cluster folder
  copy:
    src: ./docker/rabbitmq-cluster
    dest: ~/docker
    mode: 0755

- name: Shut down service
  shell: |
    cd ~/docker/rabbitmq-cluster
    docker compose down

- name: Start rabbitmq-cluster
  shell: |
    cd ~/docker/rabbitmq-cluster
    export RABBITMQ_DEFAULT_USER={{rabbitmq_cluster_user}}
    export RABBITMQ_DEFAULT_PASS={{rabbitmq_cluster_password}}
    export RABBITMQ_DEFAULT_VHOST=/
    export NETWORK={{network}}
    docker compose up -d
