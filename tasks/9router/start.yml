---
- name: Copy 9router folder
  copy:
    src: ./docker/9router
    dest: ~/docker
    mode: 0755

- name: Shut down service
  shell: |
    cd ~/docker/9router
    docker compose down

- name: Start services
  shell: |
    cd ~/docker/9router
    export OPEN_NOTEBOOK_ENCRYPTION_KEY={{open_notebook_encryption_key}}
    export OPEN_NOTEBOOK_PASSWORD={{open_notebook_password}}
    export SURREAL_PASSWORD={{surreal_password}}
    export VIRTUAL_HOST={{virtual_host}}
    export API_VIRTUAL_HOST={{api_virtual_host}}
    export NETWORK={{network}}
    export LETSENCRYPT_EMAIL={{letsencrypt_email}}
    docker compose up -d
