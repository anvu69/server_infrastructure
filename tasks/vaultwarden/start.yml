---
# Re-runnable: renders compose from vars, pulls the pinned tag, and `up -d`
# only recreates the container when the image or config changed.
- name: Ensure vaultwarden directory exists
  file:
    path: ~/docker/vaultwarden
    state: directory
    mode: "0700"

- name: Render vaultwarden docker-compose.yml
  template:
    src: templates/vaultwarden/docker-compose.yml.j2
    dest: ~/docker/vaultwarden/docker-compose.yml
    mode: "0600"

- name: Pull image vaultwarden/server:{{ vaultwarden_tag }}
  shell: docker pull vaultwarden/server:{{ vaultwarden_tag }}

- name: Start vaultwarden
  shell: |
    cd ~/docker/vaultwarden
    docker compose up -d
