---
- name: Install cliproxyapi

  hosts: all

  become: true

  pre_tasks:
    - import_tasks: tasks/common/only-on-service-hosts.yml
      vars:
        service: cliproxyapi

  tasks:
    - import_tasks: tasks/cliproxyapi/build-config.yml
    - import_tasks: tasks/cliproxyapi/start.yml
    - import_tasks: tasks/common/prune.yml
