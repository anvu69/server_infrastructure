---
- name: Deploy PostgreSQL with Citus extension and Patroni template HA and load balancing with HAproxy service

  become: true

  hosts: all

  pre_tasks:
    - import_tasks: tasks/common/only-on-service-hosts.yml
      vars:
        service: patroni

  tasks:
    - name: Prepare Patroni compose files
      ansible.builtin.import_tasks: tasks/patroni/pre.yml

    - name: Start Patroni compose stack
      ansible.builtin.import_tasks: tasks/patroni/start.yml
