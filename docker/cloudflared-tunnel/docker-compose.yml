---
name: cloudflared-vpc

services:
  cloudflared:
    container_name: cloudflared-vpc
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.11.2}
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol quic --metrics 127.0.0.1:2000 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set by Ansible}
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [tunnel]

networks:
  tunnel:
    name: ${CLOUDFLARED_NETWORK:-patroni_tunnel}
    external: true
