services:
  wordpress:
    image: bitnami/wordpress-nginx:latest
    container_name: wordpress
    restart: always
    ports:
      - 8080
      - 8443
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - WORDPRESS_DATABASE_HOST=mariadb
      - WORDPRESS_DATABASE_USER=${DATABASE_USER:-wordpress}
      - WORDPRESS_DATABASE_PASSWORD=${DATABASE_PASSWORD:-wordpress}
      - WORDPRESS_DATABASE_NAME=${DATABASE_NAME:-wordpress}
      - WORDPRESS_RESET_DATA_PERMISSIONS=no
      - WORDPRESS_EXTRA_WP_CONFIG_CONTENT=define('WP_MEMORY_LIMIT', '512M');
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=${VIRTUAL_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    logging:
      driver: local
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-10}
    networks:
      - default
    depends_on:
      - mariadb
    volumes:
      - wordpress_data:/bitnami/wordpress
      - ./php.ini:/opt/bitnami/php/etc/php.ini:rw
      - ./nginx.conf:/opt/bitnami/nginx/conf/nginx.conf:rw
  mariadb:
    image: bitnami/mariadb:latest
    container_name: mariadb
    restart: always
    ports:
      - "${MARIADB_EXPOSED_PORT:-3306}:3306"
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - MARIADB_ROOT_PASSWORD=${DATABASE_ROOT_PASSWORD:-root}
      - MARIADB_USER=${DATABASE_USER:-wordpress}
      - MARIADB_PASSWORD=${DATABASE_PASSWORD:-wordpress}
      - MARIADB_DATABASE=${DATABASE_NAME:-wordpress}
    logging:
      driver: local
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-10}
    networks:
      - default
    volumes:
      - mariadb_data:/bitnami/mariadb

volumes:
  wordpress_data:
  mariadb_data:

networks:
  default:
    name: ${NETWORK:-nginx_proxy}
    external: true