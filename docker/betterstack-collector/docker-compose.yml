---
# Source: https://github.com/BetterStackHQ/collector/blob/v1.2.5/docker-compose.yml
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  collector:
    image: ghcr.io/betterstackhq/collector:${BETTERSTACK_COLLECTOR_TAG:?}
    container_name: better-stack-collector
    restart: always
    uts: host
    cpus: ${BETTERSTACK_COLLECTOR_CPUS:-1.2}
    mem_reservation: 512m
    mem_limit: 1024m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "if [ -x /var/lib/better-stack/collector/healthcheck.sh ]; then /var/lib/better-stack/collector/healthcheck.sh; else exit 0; fi"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    environment:
      - COLLECTOR_SECRET
      - BASE_URL
      - CLUSTER_COLLECTOR
      - VECTOR_LOG_FORMAT=json
      - HOSTNAME
      - COLLECT_OTEL_HTTP_PORT
      - COLLECT_OTEL_GRPC_PORT
      - INSTALLED_AS=docker
    volumes:
      - /:/host:ro
      - /var/lib/better-stack:/var/lib/better-stack

  collector-host:
    image: ghcr.io/betterstackhq/collector-ebpf:${BETTERSTACK_COLLECTOR_TAG:?}
    container_name: better-stack-collector-host
    restart: always
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 90s
    privileged: true
    pid: host
    uts: host
    network_mode: host
    cpus: ${BETTERSTACK_COLLECTOR_HOST_CPUS:-1.0}
    mem_reservation: 1536m
    mem_limit: 2048m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "if [ -x /var/lib/better-stack/ebpf/healthcheck.sh ]; then /var/lib/better-stack/ebpf/healthcheck.sh; else exit 0; fi"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 2
    environment:
      # Keep the Go memory limit below the container limit.
      - GOMEMLIMIT=1400MiB
      - HOSTNAME
      - ENABLE_DOCKERPROBE
      - INSTALLED_AS=docker
    volumes:
      - /:/host:ro
      - /sys/kernel/tracing:/sys/kernel/tracing:rw
      - /sys/kernel/debug:/sys/kernel/debug:rw
      - /sys/kernel/security:/sys/kernel/security:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/better-stack:/var/lib/better-stack
    depends_on:
      - collector
