services:
  weserv:
    image: ghcr.io/weserv/images:5.x
    container_name: weserv
    restart: always
    shm_size: 1gb
    ports:
      - ${VIRTUAL_PORT:-80}
    networks:
      - default
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PORT=${VIRTUAL_PORT}
      - LETSENCRYPT_HOST=${VIRTUAL_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}

networks:
  default:
    name: ${NETWORK:-nginx_proxy}
    external: true
